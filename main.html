<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aster_edge — ChickCombo console</title>
  <style>
    :root {
      --bg0:#0c0f14;
      --bg1:#121826;
      --ink:#e8f0ff;
      --muted:#9fb2d7;
      --accent:#f7c948;
      --fire:#ff7a45;
      --aqua:#4cc9f0;
      --plant:#8fffba;
      --spark:#ffd447;
      --frost:#9bd6ff;
      --stone:#c7b8ff;
      --shadow:#b892ff;
      --crystal:#ffe0f7;
      --card:#1b2233;
      --line:#2a334a;
    }
    * { box-sizing: border-box; }
    body {
      margin:0;
      font-family: ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--ink);
      background: radial-gradient(1200px 800px at 20% 0%, #1a2140 0%, var(--bg0) 55%);
      min-height: 100vh;
    }
    header {
      padding: 28px clamp(16px, 4vw, 48px);
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(247,201,72,0.12), transparent);
    }
    header h1 { margin:0 0 8px; font-size: clamp(26px, 4vw, 40px); letter-spacing: 0.04em; }
    header p { margin:0; color: var(--muted); max-width: 900px; line-height: 1.5; }
    .wrap { padding: 24px clamp(16px, 4vw, 48px) 80px; display: grid; gap: 22px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .card {
      background: linear-gradient(180deg, rgba(27,34,51,0.95), rgba(15,18,28,0.95));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }
    .card h2 { margin: 0 0 12px; font-size: 18px; color: var(--accent); }
    label { display:block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, select, button, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0f1420;
      color: var(--ink);
    }
    button { cursor: pointer; font-weight: 600; border: 1px solid rgba(247,201,72,0.35); }
    button.primary { background: linear-gradient(90deg, #f7c948, #ffb703); color:#1a1203; }
    button.ghost { background: transparent; color: var(--ink); }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > * { flex: 1 1 160px; }
    .log {
      min-height: 180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    table { width:100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align:left; }
    th { color: var(--muted); font-weight: 600; }
    .pill {
      display:inline-flex; align-items:center; gap:6px;
      padding: 4px 10px; border-radius: 999px;
      border:1px solid var(--line); background:#121826; font-size:12px; color: var(--muted);
    }
    .elem1{color:var(--fire)} .elem2{color:var(--aqua)} .elem3{color:var(--plant)}
    .elem4{color:var(--spark)} .elem5{color:var(--frost)} .elem6{color:var(--stone)}
    .elem7{color:var(--shadow)} .elem8{color:var(--crystal)}
    canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.35; }
    .above { position: relative; z-index: 1; }
    footer { padding: 24px; color: var(--muted); font-size: 12px; text-align:center; border-top:1px solid var(--line); }
    a { color: var(--accent); }
    .tip { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 8px 0; }
    .kbd { font-family: ui-monospace, monospace; border:1px solid var(--line); padding:2px 6px; border-radius:6px; background:#0f1420; }
    .cols { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; }
    .pos { color: #7CFFB2; font-weight: 700; }
    .neg { color: #FF7A7A; font-weight: 700; }
    .zero { color: var(--muted); }
    .micro { font-size: 11px; color: var(--muted); }
    .hero { font-size: 15px; color: var(--ink); margin-top: 6px; }
    .split { height:1px; background: var(--line); margin: 14px 0; }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="above">
    <header>
      <h1>aster_edge</h1>
      <p>
        Barnyard battle console themed like a pocket-monster league desk. Pair species, stage mock spars,
        and read type skew before you ship calldata to ChickCombo. Purely client-side — connect wallets only
